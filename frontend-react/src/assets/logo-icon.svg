<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="40%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="blueLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B3E5FC"/>
      <stop offset="50%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#00A8E8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="50%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2044"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A8E8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.5"/>
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.2"/>

  <!-- Eagle Wings -->
  <g filter="url(#glow)" transform="translate(256, 175)" fill="url(#blueLight)">
    <!-- Left wing -->
    <path d="M-10,-18 C-30,-42 -65,-70 -100,-75 C-82,-55 -65,-38 -48,-26 C-65,-30 -95,-42 -125,-38 C-100,-22 -72,-10 -48,-6 C-65,-6 -88,0 -108,10 C-82,10 -55,6 -34,0 C-24,-3 -15,-7 -10,-13 Z" opacity="0.9"/>
    <!-- Right wing -->
    <path d="M10,-18 C30,-42 65,-70 100,-75 C82,-55 65,-38 48,-26 C65,-30 95,-42 125,-38 C100,-22 72,-10 48,-6 C65,-6 88,0 108,10 C82,10 55,6 34,0 C24,-3 15,-7 10,-13 Z" opacity="0.9"/>
    <!-- Eagle head -->
    <ellipse cx="0" cy="-24" rx="9" ry="12" opacity="0.85"/>
    <!-- Beak -->
    <path d="M0,-15 L5,-10 L0,-5 L-5,-10 Z" fill="#B3E5FC" opacity="0.8"/>
    <!-- Tail -->
    <path d="M-7,0 C-5,18 -2,30 0,36 C2,30 5,18 7,0 C5,6 2,10 0,12 C-2,10 -5,6 -7,0 Z" opacity="0.75"/>
  </g>

  <!-- Letter L -->
  <g filter="url(#shadow)">
    <path d="M115,225 L115,420 L220,420 L220,396 C220,391 217,388 212,388 L160,388 L160,225 C160,220 157,217 152,217 L123,217 C118,217 115,220 115,225 Z" fill="url(#blue)"/>
    <rect x="108" y="213" width="60" height="7" rx="2" fill="url(#blue)" opacity="0.7"/>
    <rect x="108" y="416" width="120" height="7" rx="2" fill="url(#blue)" opacity="0.7"/>
  </g>

  <!-- Letter T -->
  <g filter="url(#shadow)">
    <path d="M290,260 L290,420 C290,425 293,428 298,428 L327,428 C332,428 335,425 335,420 L335,260" fill="url(#blue)"/>
    <path d="M255,225 L255,252 C255,256 258,260 262,260 L363,260 C367,260 370,256 370,252 L370,225 C370,221 367,217 363,217 L262,217 C258,217 255,221 255,225 Z" fill="url(#blue)"/>
    <rect x="248" y="213" width="130" height="7" rx="2" fill="url(#blue)" opacity="0.7"/>
  </g>

</svg>
