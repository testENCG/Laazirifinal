<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inscription — LAAZIRI TRAVEL</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--dark); padding:20px 0; }
    .auth-wrap { width:100%; max-width:460px; padding:20px; }
    .auth-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:40px 36px; }
    .auth-logo { text-align:center; margin-bottom:28px; }
    .auth-logo span { font-size:1.5rem; font-weight:800; color:var(--primary); }
    .auth-title { text-align:center; font-size:1.3rem; font-weight:700; margin-bottom:6px; }
    .auth-sub { text-align:center; color:var(--muted); font-size:.88rem; margin-bottom:28px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span>🌴 LAAZIRI TRAVEL</span></div>
    <div class="auth-title">Créer un compte</div>
    <div class="auth-sub">Rejoignez-nous et réservez vos aventures</div>
    
    <div id="reg-alert"></div>
    
    <div class="grid-2 mb-3">
      <div class="form-group">
        <label class="form-label">Prénom</label>
        <input class="form-control" id="prenom" placeholder="Omar" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input class="form-control" id="nom" placeholder="Laloun" autocomplete="family-name">
      </div>
    </div>
    <div class="form-group mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="votre@email.com" autocomplete="email">
    </div>
    <div class="form-group mb-3">
      <label class="form-label">Téléphone</label>
      <input type="tel" class="form-control" id="tel" placeholder="+212 6XX XXX XXX" autocomplete="tel">
    </div>
    <div class="form-group mb-4">
      <label class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="password" placeholder="Minimum 6 caractères" autocomplete="new-password">
    </div>
    
    <button class="btn btn-primary" style="width:100%;justify-content:center;font-size:1rem;height:48px;" onclick="doRegister()" id="reg-btn">
      Créer mon compte
    </button>
    
    <p style="text-align:center;margin-top:20px;font-size:.88rem;color:var(--muted);">
      Déjà inscrit ? <a href="login.html" style="color:var(--primary);font-weight:600;">Se connecter</a>
    </p>
    <p style="text-align:center;margin-top:10px;font-size:.85rem;">
      <a href="/" style="color:var(--muted);">← Retour à l'accueil</a>
    </p>
  </div>
</div>
<script src="../js/api.js"></script>
<script>
if (getUser()) { location.href = '/'; }

async function doRegister() {
  const prenom = document.getElementById('prenom').value.trim();
  const nom = document.getElementById('nom').value.trim();
  const email = document.getElementById('email').value.trim();
  const tel = document.getElementById('tel').value.trim();
  const pwd = document.getElementById('password').value;
  const alert = document.getElementById('reg-alert');
  const btn = document.getElementById('reg-btn');
  
  if (!prenom || !nom || !email || !pwd) {
    alert.innerHTML = '<div class="alert alert-danger">Remplissez tous les champs obligatoires</div>'; return;
  }
  if (pwd.length < 6) {
    alert.innerHTML = '<div class="alert alert-danger">Le mot de passe doit contenir au moins 6 caractères</div>'; return;
  }
  
  btn.textContent = '⏳ Création...'; btn.disabled = true;
  try {
    const data = await apiFetch('/auth/register', { method:'POST', body: JSON.stringify({ prenom, nom, email, telephone: tel, password: pwd, role: 'client' }) });
    setAuth(data.token, data.user);
    toast('✅ Compte créé ! Bienvenue ' + data.user.prenom);
    setTimeout(() => location.href = 'dashboard.html', 800);
  } catch(e) {
    alert.innerHTML = `<div class="alert alert-danger">❌ ${e.message}</div>`;
    btn.textContent = 'Créer mon compte'; btn.disabled = false;
  }
}
</script>
</body>
</html>
