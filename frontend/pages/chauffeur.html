<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Espace Chauffeur — LAAZIRI TRAVEL</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="/"><span>🌴 LAAZIRI TRAVEL</span></a>
  <div class="navbar-nav">
    <span style="background:rgba(255,107,53,0.15);color:var(--accent);padding:4px 12px;border-radius:100px;font-size:.8rem;font-weight:600;">🚗 Chauffeur</span>
    <button class="btn btn-ghost btn-sm" onclick="clearAuth();location.href='/'">Déconnexion</button>
  </div>
</nav>

<div class="dash-layout">
  <aside class="sidebar">
    <div style="padding:12px 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px;">
      <div id="ch-avatar" style="width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:8px;">🚗</div>
      <div id="ch-name" class="font-bold"></div>
      <div id="ch-vehicle" class="text-xs text-muted mt-1"></div>
    </div>
    <button class="sidebar-item active" id="sb-courses" onclick="showSection('courses')"><span class="sidebar-icon">📋</span> Mes Courses</button>
    <button class="sidebar-item" id="sb-profil" onclick="showSection('profil')"><span class="sidebar-icon">👤</span> Mon Profil</button>
  </aside>

  <main class="dash-content">

    <!-- COURSES -->
    <div id="section-courses">
      <div class="dash-header"><h2>📋 Mes Courses</h2><p>Consultez et gérez vos courses assignées</p></div>
      <div class="grid-4 mb-4" id="ch-stats"><div class="spinner"></div></div>
      <div class="flex gap-2 mb-4">
        <button class="btn btn-ghost btn-sm" onclick="loadCourses('')">Toutes</button>
        <button class="btn btn-ghost btn-sm" onclick="loadCourses('confirmee')">✅ Assignées</button>
        <button class="btn btn-ghost btn-sm" onclick="loadCourses('en_cours')">🔄 En cours</button>
        <button class="btn btn-ghost btn-sm" onclick="loadCourses('terminee')">🏁 Terminées</button>
      </div>
      <div id="courses-list"><div class="spinner"></div></div>
    </div>

    <!-- PROFIL CHAUFFEUR -->
    <div id="section-profil" class="hidden">
      <div class="dash-header"><h2>👤 Mon Profil</h2></div>
      <div id="profil-ch-content"><div class="spinner"></div></div>
    </div>

  </main>
</div>

<!-- MODAL DETAIL COURSE -->
<div class="modal-overlay" id="modal-course-detail">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">🗺️ Détail de la course</span><button class="modal-close">×</button></div>
    <div id="course-detail-content"></div>
  </div>
</div>

<a class="wa-float" href="https://wa.me/212652640646" target="_blank">💬</a>

<script src="../js/api.js"></script>
<script>
const user = getUser();
if (!user || user.role !== 'chauffeur') { location.href = 'login.html'; }

let chProfil = null;
let allCourses = [];

async function init() {
  try {
    chProfil = await apiFetch('/chauffeur/profil');
    document.getElementById('ch-name').textContent = chProfil.nom_complet;
    document.getElementById('ch-vehicle').textContent = chProfil.vehicule_marque + ' — ' + chProfil.plaque;
  } catch(e) {}
  loadCourses('');
}

function showSection(name) {
  document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('hidden'));
  document.getElementById('section-' + name).classList.remove('hidden');
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  document.getElementById('sb-' + name)?.classList.add('active');
  if (name === 'courses') loadCourses('');
  if (name === 'profil') loadProfilCh();
}

async function loadCourses(statut) {
  const el = document.getElementById('courses-list');
  el.innerHTML = '<div class="spinner"></div>';
  try {
    const data = await apiFetch('/chauffeur/courses');
    allCourses = data;
    const filtered = statut ? data.filter(r => r.statut === statut) : data;

    // Stats
    const total = data.length;
    const enCours = data.filter(r=>r.statut==='en_cours').length;
    const terminee = data.filter(r=>r.statut==='terminee').length;
    document.getElementById('ch-stats').innerHTML = `
      <div class="card p-3 text-center"><div class="stat-value">${total}</div><div class="stat-label">Total courses</div></div>
      <div class="card p-3 text-center"><div class="stat-value" style="color:var(--warning)">${enCours}</div><div class="stat-label">En cours</div></div>
      <div class="card p-3 text-center"><div class="stat-value" style="color:var(--success)">${terminee}</div><div class="stat-label">Terminées</div></div>
      <div class="card p-3 text-center"><div class="stat-value">⭐ ${chProfil?.note_moyenne||5}</div><div class="stat-label">Ma note</div></div>
    `;

    if (!filtered.length) { el.innerHTML = '<div class="alert alert-warning">Aucune course trouvée.</div>'; return; }

    el.innerHTML = filtered.map(r => `
      <div class="card p-4 mb-3 fade-in">
        <div class="flex justify-between items-center mb-3">
          <div>
            <span class="font-bold text-primary">${r.reference}</span>
            <span class="text-muted text-sm ml-2">${serviceIcon(r.type_service)}</span>
          </div>
          ${badgeHTML(r.statut)}
        </div>
        <div class="grid-2 gap-3 mb-3">
          <div>
            <div class="text-xs text-muted">Client</div>
            <div class="font-bold mt-1">${r.client ? r.client.prenom+' '+r.client.nom : '—'}</div>
            <div class="text-sm text-muted">${r.client?.telephone||''}</div>
          </div>
          <div>
            <div class="text-xs text-muted">Date & Heure</div>
            <div class="font-bold mt-1">${formatDate(r.date_depart)}</div>
          </div>
          <div>
            <div class="text-xs text-muted">Départ</div>
            <div class="mt-1">📍 ${r.depart}</div>
          </div>
          <div>
            <div class="text-xs text-muted">Destination</div>
            <div class="mt-1">🏁 ${r.destination}</div>
          </div>
        </div>
        ${r.notes ? `<div class="text-sm text-muted mb-3">📝 ${r.notes}</div>` : ''}
        <div class="flex gap-2 mt-2">
          ${r.statut === 'confirmee' ? `
            <button class="btn btn-primary btn-sm" onclick="updateStatut(${r.id},'en_cours')">▶️ Démarrer la course</button>
            <button class="btn btn-ghost btn-sm" onclick="callClient('${r.client?.telephone||''}')">📞 Appeler le client</button>
          ` : ''}
          ${r.statut === 'en_cours' ? `
            <button class="btn btn-accent btn-sm" onclick="updateStatut(${r.id},'terminee')">✅ Terminer la course</button>
            <button class="btn btn-ghost btn-sm" onclick="callClient('${r.client?.telephone||''}')">📞 Appeler le client</button>
          ` : ''}
          ${r.statut === 'terminee' ? `<span class="badge badge-success">🏁 Course terminée</span>` : ''}
        </div>
      </div>
    `).join('');
  } catch(e) { el.innerHTML = '<div class="alert alert-danger">Erreur: ' + e.message + '</div>'; }
}

async function updateStatut(rid, statut) {
  const labels = { en_cours: 'Démarrer', terminee: 'Terminer' };
  if (!confirm(`Confirmer: ${labels[statut] || statut} la course?`)) return;
  try {
    await apiFetch('/courses/' + rid + '/statut', { method:'PUT', body: JSON.stringify({ statut }) });
    toast(statut === 'en_cours' ? '▶️ Course démarrée!' : '✅ Course terminée!');
    loadCourses('');
  } catch(e) { toast(e.message, 'danger'); }
}

function callClient(tel) {
  if (tel) window.open('tel:' + tel);
}

async function loadProfilCh() {
  const el = document.getElementById('profil-ch-content');
  if (!chProfil) { el.innerHTML = '<div class="alert alert-warning">Profil introuvable.</div>'; return; }
  el.innerHTML = `
    <div class="card p-4" style="max-width:500px;">
      <div class="grid-2 gap-4 mb-4">
        <div>
          <div class="text-xs text-muted">Nom complet</div>
          <div class="font-bold mt-1">${chProfil.nom_complet}</div>
        </div>
        <div>
          <div class="text-xs text-muted">Téléphone</div>
          <div class="font-bold mt-1">${chProfil.telephone}</div>
        </div>
        <div>
          <div class="text-xs text-muted">Véhicule</div>
          <div class="font-bold mt-1">🚗 ${chProfil.vehicule_marque}</div>
        </div>
        <div>
          <div class="text-xs text-muted">Type</div>
          <div class="font-bold mt-1">${chProfil.vehicule_type}</div>
        </div>
        <div>
          <div class="text-xs text-muted">Plaque</div>
          <div class="font-bold mt-1">${chProfil.plaque}</div>
        </div>
        <div>
          <div class="text-xs text-muted">Statut</div>
          <div class="mt-1">${chProfil.statut==='disponible'?'<span class="badge badge-success">Disponible</span>':chProfil.statut==='en_course'?'<span class="badge badge-warning">En course</span>':'<span class="badge badge-muted">'+chProfil.statut+'</span>'}</div>
        </div>
      </div>
      <div class="flex gap-4 p-3" style="background:rgba(0,168,232,0.08);border-radius:10px;">
        <div class="text-center flex-1"><div class="stat-value">⭐ ${chProfil.note_moyenne}</div><div class="stat-label">Note</div></div>
        <div class="text-center flex-1"><div class="stat-value">${chProfil.total_courses}</div><div class="stat-label">Courses totales</div></div>
      </div>
    </div>
  `;
}

init();
</script>
</body>
</html>
